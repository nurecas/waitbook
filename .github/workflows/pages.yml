name: Deploy to GitHub Pages

# Publishes the app (a static site) when main changes, or on demand. Enable Pages with "GitHub Actions" as the
# source in the repository settings first.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Assemble the site (app files only)
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js data i18n img vendor _site/
          touch _site/.nojekyll
          # A new service-worker version per deploy, so every visitor moves to the new files together.
          sed -i "s/^var VERSION = '[^']*';/var VERSION = 'waitbook-${GITHUB_SHA::12}';/" _site/sw.js
          grep -q "waitbook-${GITHUB_SHA::12}" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
