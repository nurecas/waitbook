name: Refresh catalog data

# Weekly: fetch the live Kiwix catalog (newest files and sizes) and check every link Waitbook offers.
# The link report is attached to the run; refreshed Kiwix data is committed when it changed.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Refresh the Kiwix snapshot (fails if a curated name disappeared)
        run: node tools/refresh-kiwix.mjs --strict
      - name: Check links
        run: node tools/check-links.mjs --out link-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: link-report.md
      - name: Unit tests still pass with the new data
        run: node --test tests/unit/*.test.cjs
      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kiwix-known.js data/kiwix-snapshot.js
          git commit -m "Refresh Kiwix catalog snapshot"
          git push
